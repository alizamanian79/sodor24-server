# ==================== Jpa config Mysql ==================== #
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/sodor24db?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# ==================== Spring config ==================== #
spring.application.name=sodor24-server
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
boycott.countries=
#boycott.countries=United States
server.port=${SERVER_PORT:8181}
app.client.host=${APP_CLIENT_HOST:http://192.168.1.7:3000}
app.env=${APP_ENV:dev}
application.wallet-service.currency=${CURRENCY:IRT}


# ==================== Catching config ==================== #
app.cache.type=${CACHE_TYPE:redis}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:guest}

# local fallback
app.cache.fallback=true

# ==================== RabbitMQ config ==================== #
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}

# ==================== Wallet config ==================== #
application.wallet-service.rabbitmq.exchange=wallet.exchange
